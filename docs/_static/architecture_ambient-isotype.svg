<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 570" font-family="Helvetica, Arial, sans-serif" font-size="14" role="img" aria-labelledby="t d">
  <title id="t">Protein noise model with protein_noise_model="ambient_isotype"</title>
  <desc id="d">The protein mean has three parts. Ambient is a per-cell burden times the profile from empty droplets. Nonspecific comes from a factor inferred from the isotype controls. Native comes from the totalVI decoder. Background is ambient plus nonspecific, foreground adds native.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#333"/>
    </marker>
  </defs>
  <rect width="1240" height="570" fill="#fff"/>
  <g fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#a)">
    <path d="M190 60H250"/>
    <path d="M190 150H250"/>
    <path d="M190 250H250"/>
    <path d="M190 430H250"/>
    <path d="M420 150H470"/>
    <path d="M420 250H470"/>
    <path d="M420 60H560V80H600"/>
    <path d="M530 150H560V100H600"/>
    <path d="M530 242H600"/>
    <path d="M190 340H570V264H600"/>
    <path d="M420 420H600"/>
    <path d="M420 446H560V482H1075V310"/>
    <path d="M850 90H890V205H930"/>
    <path d="M850 250H930"/>
    <path d="M850 420H890V285H930"/>
  </g>
  <g stroke="#333" stroke-width="1.5">
    <g fill="#e8eef7">
      <rect x="20" y="40" width="170" height="40" rx="6"/>
      <rect x="20" y="130" width="170" height="40" rx="6"/>
      <rect x="20" y="230" width="170" height="40" rx="6"/>
      <rect x="20" y="320" width="170" height="40" rx="6"/>
      <rect x="20" y="410" width="170" height="40" rx="6"/>
      <rect x="250" y="40" width="170" height="40" rx="6"/>
    </g>
    <g fill="#fdf1dc">
      <rect x="250" y="120" width="170" height="60" rx="6"/>
      <rect x="250" y="220" width="170" height="60" rx="6"/>
      <rect x="250" y="400" width="170" height="60" rx="6"/>
    </g>
    <g fill="#e3f3e6">
      <rect x="470" y="130" width="60" height="40" rx="20"/>
      <rect x="470" y="230" width="60" height="40" rx="20"/>
    </g>
    <g fill="#f3e8f5">
      <rect x="600" y="62" width="250" height="56" rx="6"/>
      <rect x="600" y="222" width="250" height="56" rx="6"/>
      <rect x="600" y="392" width="250" height="56" rx="6"/>
    </g>
    <rect x="930" y="180" width="290" height="130" rx="6" fill="#fff"/>
  </g>
  <g fill="#111" text-anchor="middle">
    <text x="105" y="65">Empty droplets</text>
    <text x="105" y="155">Protein counts y</text>
    <text x="105" y="255">Isotype control counts</text>
    <text x="105" y="345">Batch b</text>
    <text x="105" y="435">z from the main model</text>
    <text x="335" y="65">Ambient profile a</text>
    <text x="335" y="146" font-weight="bold">Burden encoder</text>
    <text x="335" y="166" font-size="12">q(log c | y)</text>
    <text x="335" y="246" font-weight="bold">Isotype encoder</text>
    <text x="335" y="266" font-size="12">q(h | isotype counts)</text>
    <text x="335" y="426" font-weight="bold">totalVI decoder</text>
    <text x="335" y="446" font-size="12">protein heads</text>
    <text x="500" y="155" font-weight="bold">c</text>
    <text x="500" y="190" font-size="12" fill="#555">ambient burden</text>
    <text x="500" y="205" font-size="12" fill="#555">prior on log c: N(0, 2)</text>
    <text x="500" y="255" font-weight="bold">h</text>
    <text x="500" y="290" font-size="12" fill="#555">nonspecific factor</text>
    <text x="500" y="305" font-size="12" fill="#555">prior: N(0, 1)</text>
    <text x="725" y="86" font-weight="bold">Ambient A</text>
    <text x="725" y="106" font-size="12">c · a</text>
    <text x="725" y="246" font-weight="bold">Nonspecific N</text>
    <text x="725" y="266" font-size="12">softplus(η_b + h · Λ)</text>
    <text x="725" y="416" font-weight="bold">Native S</text>
    <text x="725" y="436" font-size="12">exp(α) · f; 0 for isotype controls</text>
    <text x="800" y="474" font-size="12" fill="#555">mixing weight π</text>
    <text x="1075" y="208" font-weight="bold">Protein likelihood</text>
    <text x="1075" y="232" font-size="12">negative binomial mixture, weight π</text>
    <text x="1075" y="256" font-size="12">background rate = A + N</text>
    <text x="1075" y="276" font-size="12">foreground rate = A + N + S</text>
    <text x="1075" y="296" font-size="12">isotype controls: background only</text>
    <text x="620" y="525" font-size="13">get_protein_noise_decomposition returns native = (1 − π) · S, ambient = A and nonspecific = N, each times the batch efficiency.</text>
    <text x="620" y="548" font-size="13">The totalVI background prior is not used in this mode.</text>
  </g>
</svg>
